<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spotify Clone</title>
<link href="https://fonts.googleapis.com/css2?family=Circular+Std:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--surface:#121212;--surface2:#181818;--surface3:#282828;--accent:#1db954;--accent-hover:#1ed760;--text:#fff;--muted:#b3b3b3;--sidebar:240px}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:1fr 90px;height:100vh;overflow:hidden}
/* SIDEBAR */
.sidebar{background:var(--bg);padding:24px 12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;grid-row:1}
.logo{padding:8px 12px 16px;display:flex;align-items:center;gap:10px}
.logo svg{width:32px;height:32px;fill:var(--accent)}
.logo span{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.nav-section{background:var(--surface2);border-radius:8px;padding:8px}
.nav-item{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:600;transition:all .15s;text-decoration:none}
.nav-item:hover,.nav-item.active{color:var(--text);background:var(--surface3)}
.nav-item svg{width:22px;height:22px;fill:currentColor;flex-shrink:0}
.library-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;color:var(--muted)}
.library-header span{font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.library-header button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.4rem;line-height:1;transition:color .15s}
.library-header button:hover{color:var(--text)}
.playlist-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;cursor:pointer;transition:background .15s}
.playlist-item:hover{background:var(--surface3)}
.playlist-thumb{width:44px;height:44px;border-radius:4px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.playlist-info p{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.playlist-info span{font-size:.75rem;color:var(--muted)}
/* MAIN */
.main{background:linear-gradient(180deg,#1a1a2e 0%,var(--surface) 40%);overflow-y:auto;grid-row:1}
.topbar{position:sticky;top:0;background:rgba(18,18,18,.85);backdrop-filter:blur(10px);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.nav-arrows{display:flex;gap:8px}
.nav-arrows button{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:background .15s}
.nav-arrows button:hover{background:rgba(255,255,255,.1)}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface3);border-radius:24px;padding:8px 16px;width:300px}
.search-bar input{background:none;border:none;color:var(--text);outline:none;font-size:.9rem;width:100%}
.search-bar input::placeholder{color:var(--muted)}
.user-area{display:flex;align-items:center;gap:8px}
.user-btn{background:var(--surface3);border:none;color:var(--text);padding:6px 16px 6px 6px;border-radius:24px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;transition:background .15s}
.user-btn:hover{background:#3e3e3e}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.content{padding:24px}
.greeting{font-size:1.8rem;font-weight:700;margin-bottom:24px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h2{font-size:1.4rem;font-weight:700}
.section-header a{font-size:.8rem;font-weight:700;color:var(--muted);text-decoration:none;text-transform:uppercase;letter-spacing:.1em;transition:color .15s}
.section-header a:hover{color:var(--text)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:40px}
.card{background:var(--surface2);border-radius:8px;padding:16px;cursor:pointer;transition:background .2s;position:relative}
.card:hover{background:var(--surface3)}
.card:hover .play-btn{opacity:1;transform:translateY(0)}
.card-thumb{width:100%;aspect-ratio:1;border-radius:6px;margin-bottom:14px;object-fit:cover;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.card-thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.card h3{font-size:.88rem;font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.play-btn{position:absolute;bottom:12px;right:12px;width:44px;height:44px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:all .2s;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.play-btn:hover{background:var(--accent-hover);transform:translateY(0) scale(1.05)!important}
.play-btn svg{fill:#000;width:18px;height:18px;margin-left:2px}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:40px}
.quick-item{background:var(--surface3);border-radius:6px;display:flex;align-items:center;gap:12px;overflow:hidden;cursor:pointer;transition:background .15s;height:60px}
.quick-item:hover{background:#3e3e3e}
.quick-thumb{width:60px;height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.quick-item span{font-size:.88rem;font-weight:700}
/* PLAYER */
.player{grid-column:1/-1;background:#181818;border-top:1px solid #282828;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;padding:0 16px}
.now-playing{display:flex;align-items:center;gap:12px}
.now-thumb{width:56px;height:56px;border-radius:4px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.now-info p{font-size:.85rem;font-weight:600}
.now-info span{font-size:.75rem;color:var(--muted)}
.heart-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;margin-left:12px;transition:color .15s}
.heart-btn:hover,.heart-btn.active{color:var(--accent)}
.player-center{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0}
.controls{display:flex;align-items:center;gap:16px}
.ctrl-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;transition:color .15s;display:flex;align-items:center}
.ctrl-btn:hover{color:var(--text)}
.ctrl-btn.active{color:var(--accent)}
.play-pause{width:36px;height:36px;border-radius:50%;background:var(--text);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.play-pause:hover{transform:scale(1.06)}
.play-pause svg{fill:#000;width:16px;height:16px}
.play-pause.playing .play-icon{display:none}
.play-pause.playing .pause-icon{display:block}
.play-pause .pause-icon{display:none}
.progress-bar{display:flex;align-items:center;gap:8px;width:100%}
.progress-bar span{font-size:.72rem;color:var(--muted);min-width:36px;text-align:center}
.track{flex:1;height:4px;background:var(--surface3);border-radius:2px;cursor:pointer;position:relative}
.track-fill{height:100%;background:var(--text);border-radius:2px;transition:width .5s linear;pointer-events:none}
.track:hover .track-fill{background:var(--accent)}
.player-right{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.vol-area{display:flex;align-items:center;gap:6px}
.vol-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;transition:color .15s}
.vol-btn:hover{color:var(--text)}
.vol-slider{width:80px;height:4px;background:var(--surface3);border-radius:2px;cursor:pointer;position:relative}
.vol-fill{height:100%;background:var(--text);border-radius:2px;width:70%}
.vol-slider:hover .vol-fill{background:var(--accent)}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
    <span>Spotify</span>
  </div>
  <div class="nav-section">
    <a class="nav-item active" href="#">
      <svg viewBox="0 0 24 24"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 0 1 3 0l7.5 4.33a2 2 0 0 1 1 1.732V21a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-6h-3v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.577a2 2 0 0 1 1-1.732l7.5-4.33z"/></svg>
      Início
    </a>
    <a class="nav-item" href="#">
      <svg viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
      Buscar
    </a>
  </div>
  <div class="nav-section" style="flex:1">
    <div class="library-header">
      <span>Sua Biblioteca</span>
      <button>+</button>
    </div>
    <div id="playlist-list"></div>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="topbar">
    <div class="nav-arrows">
      <button>&#8249;</button>
      <button>&#8250;</button>
    </div>
    <div class="search-bar">
      <svg width="16" height="16" fill="#b3b3b3" viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
      <input type="text" placeholder="O que você quer ouvir?"/>
    </div>
    <div class="user-area">
      <div class="user-btn">
        <div class="user-avatar">F</div>
        Felipe
      </div>
    </div>
  </div>
  <div class="content">
    <h1 class="greeting" id="greeting">Boa tarde</h1>
    <div class="quick-grid" id="quick-grid"></div>
    <div class="section-header"><h2>Lançamentos</h2><a href="#">Ver tudo</a></div>
    <div class="cards-grid" id="new-releases"></div>
    <div class="section-header"><h2>Feito para você</h2><a href="#">Ver tudo</a></div>
    <div class="cards-grid" id="for-you"></div>
  </div>
</main>

<!-- PLAYER -->
<footer class="player">
  <div class="now-playing">
    <div class="now-thumb" id="now-thumb">🎵</div>
    <div class="now-info">
      <p id="now-title">Escolha uma música</p>
      <span id="now-artist">—</span>
    </div>
    <button class="heart-btn" id="heart-btn">♡</button>
  </div>
  <div class="player-center">
    <div class="controls">
      <button class="ctrl-btn" id="shuffle-btn" title="Aleatório">⇄</button>
      <button class="ctrl-btn" id="prev-btn">⏮</button>
      <button class="play-pause" id="play-pause">
        <svg class="play-icon" viewBox="0 0 24 24"><path d="M7.05 3.606l13.49 7.788a.7.7 0 0 1 0 1.212L7.05 20.394A.7.7 0 0 1 6 19.788V4.212a.7.7 0 0 1 1.05-.606z"/></svg>
        <svg class="pause-icon" viewBox="0 0 24 24"><path d="M5.7 3a.7.7 0 0 0-.7.7v16.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V3.7a.7.7 0 0 0-.7-.7H5.7zm10 0a.7.7 0 0 0-.7.7v16.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V3.7a.7.7 0 0 0-.7-.7h-2.6z"/></svg>
      </button>
      <button class="ctrl-btn" id="next-btn">⏭</button>
      <button class="ctrl-btn" id="repeat-btn" title="Repetir">↺</button>
    </div>
    <div class="progress-bar">
      <span id="current-time">0:00</span>
      <div class="track" id="track-bar"><div class="track-fill" id="track-fill" style="width:0%"></div></div>
      <span id="total-time">3:30</span>
    </div>
  </div>
  <div class="player-right">
    <div class="vol-area">
      <button class="vol-btn">🔊</button>
      <div class="vol-slider"><div class="vol-fill"></div></div>
    </div>
  </div>
</footer>

<script>
const SONGS = [
  {id:1,title:"Stressed Out",artist:"Twenty One Pilots",album:"Blurryface",emoji:"🌙",duration:210,color:"#1a1a2e"},
  {id:2,title:"Heathens",artist:"Twenty One Pilots",album:"Suicide Squad OST",emoji:"🖤",duration:198,color:"#2d1b1b"},
  {id:3,title:"Ride",artist:"Twenty One Pilots",album:"Blurryface",emoji:"🎪",duration:214,color:"#1b2d1b"},
  {id:4,title:"Holding On to You",artist:"Twenty One Pilots",album:"Vessel",emoji:"⚡",duration:223,color:"#2d2d1b"},
  {id:5,title:"Car Radio",artist:"Twenty One Pilots",album:"Vessel",emoji:"📻",duration:257,color:"#1b1b2d"},
  {id:6,title:"Jumpsuit",artist:"Twenty One Pilots",album:"Trench",emoji:"🪖",duration:222,color:"#2d1b2d"},
  {id:7,title:"Chlorine",artist:"Twenty One Pilots",album:"Trench",emoji:"🧪",duration:235,color:"#1b2d2d"},
  {id:8,title:"Levitate",artist:"Twenty One Pilots",album:"Trench",emoji:"🪂",duration:159,color:"#2d2d2d"},
  {id:9,title:"Overcompensate",artist:"Twenty One Pilots",album:"Scaled and Icy",emoji:"🎭",duration:193,color:"#1a2d1a"},
  {id:10,title:"Shy Away",artist:"Twenty One Pilots",album:"Scaled and Icy",emoji:"🦋",duration:196,color:"#2d1a1a"},
  {id:11,title:"Saturday",artist:"Twenty One Pilots",album:"Scaled and Icy",emoji:"☀️",duration:188,color:"#1a1a1a"},
  {id:12,title:"Bandito",artist:"Twenty One Pilots",album:"Trench",emoji:"🏜️",duration:276,color:"#2a1a0a"},
];

const PLAYLISTS = [
  {name:"Favoritas",emoji:"❤️",desc:"Playlist"},
  {name:"Trench Era",emoji:"🪖",desc:"Álbum"},
  {name:"Vessel Era",emoji:"⚡",desc:"Álbum"},
  {name:"Blurryface",emoji:"🌙",desc:"Álbum"},
  {name:"Scaled & Icy",emoji:"🦋",desc:"Álbum"},
];

let currentIdx = 0;
let isPlaying = false;
let progress = 0;
let progressInterval = null;
let shuffle = false;
let repeat = false;
let liked = new Set();

function formatTime(s){const m=Math.floor(s/60);const sec=s%60;return`${m}:${sec.toString().padStart(2,'0')}`}

function setGreeting(){
  const h=new Date().getHours();
  const el=document.getElementById('greeting');
  if(h<12)el.textContent='Bom dia';
  else if(h<18)el.textContent='Boa tarde';
  else el.textContent='Boa noite';
}

function renderPlaylists(){
  const el=document.getElementById('playlist-list');
  el.innerHTML=PLAYLISTS.map(p=>`
    <div class="playlist-item">
      <div class="playlist-thumb">${p.emoji}</div>
      <div class="playlist-info"><p>${p.name}</p><span>${p.desc}</span></div>
    </div>`).join('');
}

function renderCards(containerId, songs){
  const el=document.getElementById(containerId);
  el.innerHTML=songs.map((s,i)=>`
    <div class="card" onclick="playSong(${SONGS.indexOf(s)})">
      <div class="card-thumb">${s.emoji}</div>
      <h3>${s.title}</h3>
      <p>${s.artist} · ${s.album}</p>
      <button class="play-btn" onclick="event.stopPropagation();playSong(${SONGS.indexOf(s)})">
        <svg viewBox="0 0 24 24"><path d="M7.05 3.606l13.49 7.788a.7.7 0 0 1 0 1.212L7.05 20.394A.7.7 0 0 1 6 19.788V4.212a.7.7 0 0 1 1.05-.606z"/></svg>
      </button>
    </div>`).join('');
}

function renderQuick(){
  const el=document.getElementById('quick-grid');
  const quick=SONGS.slice(0,6);
  el.innerHTML=quick.map(s=>`
    <div class="quick-item" onclick="playSong(${SONGS.indexOf(s)})">
      <div class="quick-thumb">${s.emoji}</div>
      <span>${s.title}</span>
    </div>`).join('');
}

function updatePlayer(){
  const s=SONGS[currentIdx];
  document.getElementById('now-thumb').textContent=s.emoji;
  document.getElementById('now-title').textContent=s.title;
  document.getElementById('now-artist').textContent=s.artist;
  document.getElementById('total-time').textContent=formatTime(s.duration);
  document.getElementById('heart-btn').textContent=liked.has(s.id)?'♥':'♡';
  document.getElementById('heart-btn').classList.toggle('active',liked.has(s.id));
  document.body.style.setProperty('--current-color',s.color);
}

function playSong(idx){
  currentIdx=idx;
  progress=0;
  isPlaying=true;
  updatePlayer();
  startProgress();
  document.getElementById('play-pause').classList.add('playing');
}

function togglePlay(){
  isPlaying=!isPlaying;
  document.getElementById('play-pause').classList.toggle('playing',isPlaying);
  if(isPlaying)startProgress(); else clearInterval(progressInterval);
}

function startProgress(){
  clearInterval(progressInterval);
  progressInterval=setInterval(()=>{
    const s=SONGS[currentIdx];
    progress++;
    if(progress>=s.duration){
      if(repeat){progress=0;}
      else{nextSong();return;}
    }
    const pct=(progress/s.duration)*100;
    document.getElementById('track-fill').style.width=pct+'%';
    document.getElementById('current-time').textContent=formatTime(progress);
  },1000);
}

function nextSong(){
  if(shuffle){currentIdx=Math.floor(Math.random()*SONGS.length);}
  else{currentIdx=(currentIdx+1)%SONGS.length;}
  progress=0;
  updatePlayer();
  if(isPlaying)startProgress();
}

function prevSong(){
  if(progress>3){progress=0;startProgress();return;}
  currentIdx=(currentIdx-1+SONGS.length)%SONGS.length;
  progress=0;
  updatePlayer();
  if(isPlaying)startProgress();
}

document.getElementById('play-pause').addEventListener('click',togglePlay);
document.getElementById('next-btn').addEventListener('click',nextSong);
document.getElementById('prev-btn').addEventListener('click',prevSong);
document.getElementById('shuffle-btn').addEventListener('click',()=>{
  shuffle=!shuffle;
  document.getElementById('shuffle-btn').classList.toggle('active',shuffle);
});
document.getElementById('repeat-btn').addEventListener('click',()=>{
  repeat=!repeat;
  document.getElementById('repeat-btn').classList.toggle('active',repeat);
});
document.getElementById('heart-btn').addEventListener('click',()=>{
  const s=SONGS[currentIdx];
  if(liked.has(s.id))liked.delete(s.id); else liked.add(s.id);
  updatePlayer();
});
document.getElementById('track-bar').addEventListener('click',(e)=>{
  const rect=e.currentTarget.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  progress=Math.floor(pct*SONGS[currentIdx].duration);
  document.getElementById('track-fill').style.width=(pct*100)+'%';
  document.getElementById('current-time').textContent=formatTime(progress);
});

setGreeting();
renderPlaylists();
renderCards('new-releases',SONGS.slice(0,6));
renderCards('for-you',SONGS.slice(6,12));
renderQuick();
updatePlayer();
</script>
</body>
</html>
